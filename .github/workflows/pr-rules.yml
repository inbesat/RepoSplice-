# P-313 — enforces the PR base-branch rule from BRANCHING.md §3.
#
# Branch protection is owner-side (see BRANCHING.md §5); this workflow makes
# the rule enforceable in CI: a PR that targets `main` must come from a
# release or hotfix branch. Everything else targets `dev`.
name: pr-rules

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  base-branch:
    name: PR base branch
    runs-on: ubuntu-latest
    steps:
      - name: Check the base branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            case "$HEAD" in
              release/*|hotfix/*)
                echo "PR targets main from $HEAD - allowed (release/hotfix)."
                ;;
              *)
                echo "::error::PR base 'main' is only allowed from release/* or hotfix/* branches. Target 'dev' instead (see BRANCHING.md)."
                exit 1
                ;;
            esac
          elif [ "$BASE" = "dev" ]; then
            echo "PR targets dev - allowed."
          else
            echo "::error::Unknown base branch '$BASE'. Use 'dev' (or 'main' for release/hotfix)."
            exit 1
          fi
