name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    name: Release
    # A tag push regenerates EVAL.md (the eval-doc job below); the publish
    # step belongs to a branch push only, so a tag can never publish twice.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - uses: changesets/action@v1
        with:
          publish: bun run changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # P-333 - the published methodology follows the tagged tree: the renderer
  # re-reads the committed artifacts and the refreshed document is committed
  # back to main.
  eval-doc:
    name: Regenerate EVAL.md
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: render EVAL.md
        run: python eval/scripts/render_eval_md.py
      - name: commit the refreshed document
        run: |
          if git diff --quiet -- EVAL.md; then
            echo "EVAL.md is already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add EVAL.md
          git commit -m 'chore(eval): regenerate EVAL.md for the release tag'
          git push origin HEAD:main

  # P-364 - the registry entry is submitted on a release tag. The entry is
  # generated from the checkout, so a stale file fails this job; the submission
  # reports an explicit skip when the registry credential is not configured,
  # because a missing secret must never read as a successful publish (ADR-173).
  registry:
    name: Publish to the MCP registry
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - name: Check the registry entry is current
        run: bun run --filter @repo-stitcher/mcp registry:check
      - name: Submit to the MCP registry
        env:
          MCP_REGISTRY_URL: ${{ vars.MCP_REGISTRY_URL }}
          MCP_REGISTRY_TOKEN: ${{ secrets.MCP_REGISTRY_TOKEN }}
        run: |
          if [ -z "$MCP_REGISTRY_URL" ] || [ -z "$MCP_REGISTRY_TOKEN" ]; then
            echo "::notice title=MCP registry::skipped - MCP_REGISTRY_URL and MCP_REGISTRY_TOKEN are not configured, so nothing was submitted"
            exit 0
          fi
          bun run --filter @repo-stitcher/mcp registry:publish
